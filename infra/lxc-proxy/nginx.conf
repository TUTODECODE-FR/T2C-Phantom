# Exemple de configuration Nginx pour LXC Proxy

# Configuration de la limite de requêtes (5 requêtes par seconde par IP)
# La zone 'mylimit' alloue 10Mo en mémoire pour suivre les IP.
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name t2c-tracker.example.com;

    # Configuration SSL (à compléter avec les vrais certificats)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Sécurité anti-smuggling et validation des requêtes HTTP
    client_header_timeout 10s;
    client_body_timeout 10s;

    location / {
        # Rate limiting : limite à 5 req/s. 'burst=10' permet des pics courts, 'nodelay' renvoie directement l'erreur
        limit_req zone=mylimit burst=10 nodelay;
        limit_req_status 429; # Too Many Requests

        # Restreindre l'IP d'origine réelle à CF (Cloudflare) pour éviter le forgeage d'IP
        real_ip_header CF-Connecting-IP;

        # Transfert de l'adresse IP d'origine du client (Vital pour le bannissement)
        proxy_set_header X-Real-IP $remote_addr;
        # Sécurisation stricte de X-Forwarded-For pour ne faire confiance qu'à Nginx
        proxy_set_header X-Forwarded-For $remote_addr; 
        proxy_set_header Host $host;

        # Terminaison WSS (WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Redirection vers l'IP interne du LXC Serveur
        # À adapter : remplacer 10.0.0.5 par l'IP locale réelle du LXC Serveur
        proxy_pass http://10.0.0.5:8080;
    }
}
