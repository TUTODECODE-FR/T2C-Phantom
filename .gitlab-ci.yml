image: golang:1.23-alpine

stages:
  - test
  - build
  - containerize

variables:
  GOPATH: $CI_PROJECT_DIR/.go

# Mise en cache des dépendances Go pour accélérer le pipeline
cache:
  paths:
    - .go/pkg/mod/

before_script:
  - mkdir -p .go
  # L'installation de build-base (gcc) est obligatoire pour utiliser le flag -race
  - apk add --no-cache git build-base

# ---------------------------------------------------------
# 1. ÉTAPE DE TEST (Sécurité & Intégrité)
# ---------------------------------------------------------
test_and_race:
  stage: test
  script:
    - echo "Lancement des tests unitaires et détection des Race Conditions..."
    - CGO_ENABLED=1 go test -v -race ./...
  
# ---------------------------------------------------------
# 2. ÉTAPE DE BUILD (Compilation des binaires)
# ---------------------------------------------------------
build_linux:
  stage: build
  script:
    - echo "Compilation du binaire Linux (Statique)..."
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o build/t2c-linux-amd64 ./cmd/t2c/main.go
  artifacts:
    paths:
      - build/t2c-linux-amd64
    expire_in: 1 week

build_windows:
  stage: build
  script:
    - echo "Compilation du binaire Windows..."
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-w -s" -o build/t2c-windows-amd64.exe ./cmd/t2c/main.go
  artifacts:
    paths:
      - build/t2c-windows-amd64.exe
    expire_in: 1 week

build_mac_arm64:
  stage: build
  script:
    - echo "Compilation du binaire macOS (Apple Silicon)..."
    - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o build/t2c-mac-arm64 ./cmd/t2c/main.go
  artifacts:
    paths:
      - build/t2c-mac-arm64
    expire_in: 1 week

# ---------------------------------------------------------
# 3. ÉTAPE DOCKER (Vérification de l'image Hardened)
# ---------------------------------------------------------
build_docker_image:
  stage: containerize
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker info
  script:
    - echo "Vérification du build de l'image Docker Distroless..."
    - docker build -t t2c-phantom-hardened:latest -f infra/Dockerfile.hardened .
  # Cette étape ne s'exécute que sur la branche main ou lors d'une Merge Request
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
