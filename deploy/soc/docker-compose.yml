version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: t2c-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: t2c-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/t2c_dashboard.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Mot de passe Grafana par défaut (changeable au démarrage)
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
