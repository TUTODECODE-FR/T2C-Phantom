global:
  scrape_interval: 5s # Fréquence de récupération des métriques de sécurité
  evaluation_interval: 5s

scrape_configs:
  - job_name: 't2c-phantom'
    static_configs:
      # host.docker.internal permet de viser la machine hôte depuis le conteneur Docker (Mac/Windows)
      # Pour Linux direct en local, utiliser 172.17.0.1 ou l'IP de la machine.
      - targets: ['host.docker.internal:2112', 'localhost:2112', '127.0.0.1:2112']
