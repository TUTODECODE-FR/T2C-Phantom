name: CI (Go)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# jeton en lecture seule par défaut (écriture seulement là où il le faut)
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Dépôt du relais (cloné à côté, comme en local)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: TUTODECODE-FR/T2C-Phantom-relay
        path: .t2c-relay
        token: ${{ secrets.RELAY_REPO_TOKEN || github.token }}
    - name: Relais à côté du dépôt
      shell: bash
      run: mv .t2c-relay ../T2C-Phantom-relay
    
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        
    - name: Verify dependencies
      run: |
        # nos dépôts locaux (relais, remplacé par un dossier voisin) n'ont pas d'archive à vérifier
        out=$(go mod verify 2>&1) || true
        rest=$(printf '%s\n' "$out" | grep -v -E '^t2c(-relay)? v0\.0\.0: missing ziphash' | grep -v '^all modules verified$' | grep . || true)
        [ -z "$rest" ] || { printf '%s\n' "$rest"; exit 1; }
      
    - name: Build
      run: go build -v ./...
      
    - name: Test
      run: go test -v -race -coverprofile=coverage.txt ./...
      
    - name: Upload coverage
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        file: ./coverage.txt
