name: CodeQL (SAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 19 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Dépôt du relais (cloné à côté, comme en local)
      uses: actions/checkout@v4
      with:
        repository: TUTODECODE-FR/T2C-Phantom-relay
        path: .t2c-relay
        token: ${{ secrets.RELAY_REPO_TOKEN || github.token }}
    - name: Relais à côté du dépôt
      shell: bash
      run: mv .t2c-relay ../T2C-Phantom-relay

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: false

    - name: Upload CodeQL SARIF artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif
        path: ${{ runner.workspace }}/results/go.sarif
        retention-days: 5
