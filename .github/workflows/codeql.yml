name: CodeQL (SAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 19 * * 1'

# jeton en lecture seule par défaut (écriture seulement là où il le faut)
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Dépôt du relais (cloné à côté, comme en local)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: TUTODECODE-FR/T2C-Phantom-relay
        path: .t2c-relay
    - name: Relais à côté du dépôt
      shell: bash
      run: mv .t2c-relay ../T2C-Phantom-relay

    - name: Initialize CodeQL
      uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
      with:
        upload: false

    - name: Upload CodeQL SARIF artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codeql-sarif
        path: ${{ runner.workspace }}/results/go.sarif
        retention-days: 5
