# Release multi-OS : toute la génération tourne sur GitHub Actions (dépôt public,
# minutes illimitées). GitLab ne lance aucun pipeline : il reçoit le code
# (mirror-gitlab.yml) et les fichiers générés (job « gitlab » ci-dessous).
#
# Déclenchement : pousser un tag vX.Y.Z, ou « Run workflow » avec un tag
# EXISTANT (le code compilé est celui du tag, jamais celui d'une branche).
# Réglages du dépôt GitHub (Settings → Secrets and variables → Actions) :
#   variable T2C_ROOT_PUBKEY : clé publique racine (sortie de `t2c-serv init`) — obligatoire
#   secret   GITLAB_TOKEN    : jeton GitLab (scopes api + write_repository) — optionnel
#   variable GITLAB_PROJECT  : ex. tutodecode-org/T2C-Phantom — optionnel
#   variables AZURE_*        : signature Windows (docs/SIGNATURE-WINDOWS.md) — optionnel
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex. v2.0.0)"
        required: true
      dry_run:
        description: "Essai à blanc : compile tout, ne publie rien (clé racine facultative)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # code compilé : toujours le tag (lancement manuel compris)
  SRC_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
  # clé publique racine attendue (versionnée ici) : la variable du dépôt doit
  # lui être identique, sinon pas de release
  EXPECTED_ROOT: 985c6d08ed885e08d69611f861595b7d4d6ae7a11a0cfc4c6a7f8267fa2d984f
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tag existant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # « essai-… » : seulement en essai à blanc (ne déclenche jamais de vraie release)
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] && ! { [ "$DRY_RUN" = true ] && [[ "$TAG" =~ ^essai-[0-9A-Za-z.-]+$ ]]; }; then
            echo "::error::tag invalide : $TAG"; exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null || { echo "::error::le tag $TAG n'existe pas"; exit 1; }
      - name: Clé racine présente
        env:
          ROOT: ${{ vars.T2C_ROOT_PUBKEY }}
        run: |
          if [ "$DRY_RUN" = true ]; then echo "::notice::essai à blanc : aucune publication"; exit 0; fi
          if ! [[ "$ROOT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Variable T2C_ROOT_PUBKEY absente ou invalide (64 caractères hex attendus)"
            exit 1
          fi
          if [ "$ROOT" != "$EXPECTED_ROOT" ]; then
            echo "::error::T2C_ROOT_PUBKEY différente de la clé racine versionnée (EXPECTED_ROOT)"
            exit 1
          fi

  desktop:
    needs: check
    name: App ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            name: macOS-universal
          - os: windows-latest
            platform: windows/amd64
            name: Windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            name: Linux-amd64
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath télécharge l'exécutable non signé de cette exécution
    env:
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SRC_REF }}
      - name: Dépôt du relais (cloné à côté, comme en local)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: TUTODECODE-FR/T2C-Phantom-relay
          path: .t2c-relay
      - name: Relais à côté du dépôt
        shell: bash
        run: mv .t2c-relay ../T2C-Phantom-relay

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Dépendances Linux (GTK / WebKit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Version du tag dans les métadonnées de l'app
        shell: bash
        run: |
          # Windows (propriétés du fichier) et macOS (Info.plist) affichent la version du tag ;
          # SignPath exige une version réelle et identique d'une compilation à l'autre.
          v="${TAG#v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || v=0.0.0
          python3 - "$v" <<'PY'
          import json, sys
          p = "desktop/wails.json"
          c = json.load(open(p, encoding="utf-8"))
          c["info"]["productVersion"] = sys.argv[1]
          json.dump(c, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          echo "version $v"

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          ROOT: ${{ vars.T2C_ROOT_PUBKEY }}
        run: |
          TAGS="${{ matrix.tags }}"
          wails build -platform ${{ matrix.platform }} -clean -trimpath -nocolour \
            ${TAGS:+-tags $TAGS} \
            -ldflags "-s -w -X main.version=${TAG} -X t2c/pkg/trust.RootPubKeyHex=${ROOT}"

      - name: Signature Developer ID + notarisation Apple
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGN_REQUIRED: ${{ vars.MACOS_SIGN_REQUIRED || '0' }}
        run: bash .github/scripts/macos-sign.sh app "desktop/build/bin/T2C Phantom.app"

      - name: Paquet macOS
        if: runner.os == 'macOS'
        working-directory: desktop/build/bin
        run: ditto -c -k --keepParent "T2C Phantom.app" "$GITHUB_WORKSPACE/T2C-Phantom-${{ matrix.name }}.zip"

      - name: Exécutable Windows non signé (pour SignPath)
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-non-signe
          path: desktop/build/bin/T2C-Phantom.exe
          if-no-files-found: error

      - name: Signature Windows (SignPath Foundation)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://app.signpath.io/Api/v1/GitHubCom/
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'T2C-Phantom' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # chaque version est approuvée à la main
          output-artifact-directory: signe

      - name: Remplacer par l'exécutable signé
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          Copy-Item signe/T2C-Phantom.exe desktop/build/bin/T2C-Phantom.exe -Force
          $sig = Get-AuthenticodeSignature desktop/build/bin/T2C-Phantom.exe
          if ($sig.Status -ne 'Valid') { Write-Error "signature Windows invalide : $($sig.Status)"; exit 1 }
          "signé par : $($sig.SignerCertificate.Subject)"

      - name: Windows non signé
        if: runner.os == 'Windows' && env.SIGNPATH_ON != 'true' && vars.AZURE_SIGNING_ACCOUNT == ''
        shell: bash
        run: |
          echo "::warning::ni SignPath ni Azure configuré : exécutable Windows NON signé (alerte SmartScreen)"

      - name: Paquet Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/build/bin/T2C-Phantom.exe -DestinationPath "T2C-Phantom-${{ matrix.name }}.zip"

      - name: Paquet Linux
        if: runner.os == 'Linux'
        run: tar czf "T2C-Phantom-${{ matrix.name }}.tar.gz" -C desktop/build/bin T2C-Phantom

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.name }}
          path: T2C-Phantom-${{ matrix.name }}.*
          if-no-files-found: error

  cli:
    needs: check
    name: CLI (t2c, t2c-peer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SRC_REF }}
      - name: Dépôt du relais (cloné à côté, comme en local)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: TUTODECODE-FR/T2C-Phantom-relay
          path: .t2c-relay
      - name: Relais à côté du dépôt
        shell: bash
        run: mv .t2c-relay ../T2C-Phantom-relay
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test -race ./...
      - name: Build multi-OS
        env:
          ROOT: ${{ vars.T2C_ROOT_PUBKEY }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            out="t2c-cli-${TAG}-${os}-${arch}"
            mkdir -p "$out"
            for cmd in t2c t2c-peer; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X t2c/pkg/buildinfo.Version=${TAG} -X t2c/pkg/trust.RootPubKeyHex=${ROOT}" -o "$out/$cmd$ext" ./cmd/$cmd
            done
            if [ "$os" = windows ]; then zip -qr "dist/$out.zip" "$out"; else tar czf "dist/$out.tar.gz" "$out"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  cli-macos:
    needs: cli
    name: CLI macOS (signature + notarisation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SRC_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli
          path: dist
      - name: Signer et notariser t2c et t2c-peer (macOS)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGN_REQUIRED: ${{ vars.MACOS_SIGN_REQUIRED || '0' }}
        run: |
          for tgz in dist/t2c-cli-*-darwin-*.tar.gz; do
            d=$(basename "$tgz" .tar.gz)
            tar xzf "$tgz"
            bash .github/scripts/macos-sign.sh binary "$d/t2c" "$d/t2c-peer"
            rm -f "$tgz" && tar czf "$tgz" "$d" && rm -rf "$d"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli
          path: dist/*
          overwrite: true
          if-no-files-found: error

  # Signature Windows par Azure Artifact Signing (crédit Azure de Microsoft for
  # Nonprofits) : app + t2c.exe + t2c-peer.exe. Connexion OIDC, aucun secret.
  # Inactive (fichiers inchangés) tant que la variable AZURE_SIGNING_ACCOUNT est vide.
  # Guide : docs/SIGNATURE-WINDOWS.md.
  sign-windows:
    needs: [desktop, cli-macos]
    name: Signature Windows (Azure)
    runs-on: windows-latest
    environment: signature-windows # sujet OIDC fixe, limité aux tags v* dans les réglages
    permissions:
      contents: read
      id-token: write # jeton OIDC pour azure/login
    env:
      AZURE_SIGN_ON: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - name: Windows non signé
        if: env.AZURE_SIGN_ON != 'true'
        shell: pwsh
        run: |
          Write-Output "::warning::AZURE_SIGNING_ACCOUNT absent : exécutables Windows NON signés par Azure (alerte SmartScreen)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.AZURE_SIGN_ON == 'true'
        with:
          pattern: "{app-Windows-amd64,cli}"
          path: in
      - name: Extraire les exécutables
        if: env.AZURE_SIGN_ON == 'true'
        shell: pwsh
        run: |
          Expand-Archive in/app-Windows-amd64/T2C-Phantom-Windows-amd64.zip -DestinationPath sign/app
          $cli = Get-Item in/cli/t2c-cli-*-windows-amd64.zip
          Expand-Archive $cli.FullName -DestinationPath sign/cli
          Get-ChildItem sign -Recurse -Filter *.exe | ForEach-Object { $_.FullName }

      - name: Connexion Azure (OIDC)
        if: env.AZURE_SIGN_ON == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # le principal n'a de rôle que sur le compte de signature

      - name: Signer (Azure Artifact Signing, signtool)
        if: env.AZURE_SIGN_ON == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\sign
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: T2C Phantom
          description-url: https://github.com/TUTODECODE-FR/T2C-Phantom
          # seule la session ouverte par azure/login sert
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Vérifier et réempaqueter
        if: env.AZURE_SIGN_ON == 'true'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem sign -Recurse -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.Name) : $($s.Status) — $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { $bad++ }
          }
          if ($bad) { Write-Error "$bad exécutable(s) mal signé(s) ou sans horodatage"; exit 1 }
          New-Item -ItemType Directory out/app, out/cli | Out-Null
          Compress-Archive -Path sign/app/* -DestinationPath out/app/T2C-Phantom-Windows-amd64.zip
          # l'artefact « cli » est renvoyé en entier, la zip Windows remplacée par la signée
          Copy-Item in/cli/* out/cli/
          $cli = Get-Item in/cli/t2c-cli-*-windows-amd64.zip
          Remove-Item "out/cli/$($cli.Name)"
          Compress-Archive -Path sign/cli/* -DestinationPath "out/cli/$($cli.Name)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.AZURE_SIGN_ON == 'true'
        with:
          name: app-Windows-amd64
          path: out/app/*
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.AZURE_SIGN_ON == 'true'
        with:
          name: cli
          path: out/cli/*
          overwrite: true
          if-no-files-found: error

  notes:
    needs: check
    name: Notes de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SRC_REF }}
          fetch-depth: 0 # historique et tags complets : comparaison avec la version précédente
      - name: Ancien vs nouveau
        run: |
          mkdir -p notes
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes/notes.md
          cat notes/notes.md >> "$GITHUB_STEP_SUMMARY"
          cat notes/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes/notes.md

  release:
    needs: [desktop, sign-windows, notes]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{app-*,cli}"
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes
      - name: Sommes de contrôle
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes/notes.md
          else
            # pré-version tant que le réseau n'est pas ouvert au public (variable T2C_PUBLIC_RELEASE=true pour la sortie)
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "T2C Phantom $TAG" --notes-file notes/notes.md ${{ vars.T2C_PUBLIC_RELEASE == 'true' && '--latest' || '--prerelease' }}
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: out/*

  gitlab:
    needs: release
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
    steps:
      - name: GitLab configuré ?
        id: cfg
        run: |
          if [ -n "$GITLAB_TOKEN" ] && [ -n "$GITLAB_PROJECT" ]; then echo "on=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::GITLAB_TOKEN / GITLAB_PROJECT absents : publication GitLab ignorée"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.on
        with:
          name: release-files
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.on
        with:
          name: release-notes
          path: notes
      - name: Cohérence des fichiers et des sommes de contrôle
        if: steps.cfg.outputs.on
        working-directory: out
        run: |
          set -euo pipefail
          # chaque fichier publié doit figurer dans SHA256SUMS.txt, et chaque somme doit correspondre
          sha256sum -c SHA256SUMS.txt
          for f in *; do
            [ "$f" = SHA256SUMS.txt ] && continue
            grep -q "  $f\$" SHA256SUMS.txt || { echo "::error::$f absent de SHA256SUMS.txt"; exit 1; }
          done
          listed=$(wc -l < SHA256SUMS.txt); present=$(( $(ls | wc -l) - 1 ))
          [ "$listed" -eq "$present" ] || { echo "::error::$listed sommes pour $present fichiers"; exit 1; }
          echo "$present fichiers, sommes vérifiées"

      - name: Fichiers → registre GitLab + release
        if: steps.cfg.outputs.on
        run: |
          set -euo pipefail
          api="https://gitlab.com/api/v4/projects/$(jq -rn --arg p "$GITLAB_PROJECT" '$p|@uri')"
          ver="${TAG#v}"
          links="[]"
          for f in out/*; do
            name=$(basename "$f")
            url="$api/packages/generic/t2c-phantom/$ver/$name"
            curl -fsS --retry 3 -H "PRIVATE-TOKEN: $GITLAB_TOKEN" --upload-file "$f" "$url" >/dev/null
            links=$(jq -c --arg n "$name" --arg u "$url" '. + [{name:$n, url:$u, link_type:"package"}]' <<<"$links")
            echo "↑ $name"
          done
          body=$(jq -n --arg tag "$TAG" --argjson links "$links" --rawfile notes notes/notes.md \
            '{tag_name:$tag, ref:"main", name:("T2C Phantom " + $tag),
              description:($notes + "\n\nFichiers générés par GitHub Actions et recopiés ici."), assets:{links:$links}}')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            -H "Content-Type: application/json" -X POST "$api/releases" -d "$body")
          if [ "$code" = 409 ]; then
            echo "release GitLab déjà existante : notes mises à jour, liens ajoutés un par un"
            curl -s -o /dev/null -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
              -X PUT "$api/releases/$TAG" -d "$(jq -n --rawfile n notes/notes.md '{description:$n}')" || true
            for row in $(jq -c '.[]' <<<"$links"); do
              curl -s -o /dev/null -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
                -X POST "$api/releases/$TAG/assets/links" -d "$row" || true
            done
          elif [ "${code:0:1}" != 2 ]; then
            cat /tmp/r.json; exit 1
          fi
          # contrôle final : la release GitLab référence exactement les fichiers publiés sur GitHub
          got=$(curl -fsS -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/releases/$TAG" | jq '[.assets.links[].name] | unique | length')
          want=$(ls out | wc -l)
          [ "$got" -eq "$want" ] || { echo "::error::GitLab : $got fichiers liés au lieu de $want"; exit 1; }
          echo "Release GitLab $TAG publiée ($got fichiers)"
