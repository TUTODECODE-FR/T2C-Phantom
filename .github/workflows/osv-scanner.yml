name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [ "main" ]

# jeton en lecture seule par défaut (écriture seulement là où il le faut)
permissions:
  contents: read

jobs:
  scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Dépôt du relais (cloné à côté, comme en local)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: TUTODECODE-FR/T2C-Phantom-relay
        path: .t2c-relay
        token: ${{ secrets.RELAY_REPO_TOKEN || github.token }}
    - name: Relais à côté du dépôt
      shell: bash
      run: mv .t2c-relay ../T2C-Phantom-relay
    
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        
    - name: Run Google OSV-Scanner Natively
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2 # version fixe (pas de @v1 flottant)
        osv-scanner --config osv-scanner.toml -r ./
