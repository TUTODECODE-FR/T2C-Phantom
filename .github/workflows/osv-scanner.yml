name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [ "main" ]

jobs:
  scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Dépôt du relais (cloné à côté, comme en local)
      uses: actions/checkout@v4
      with:
        repository: TUTODECODE-FR/T2C-Phantom-relay
        path: .t2c-relay
        token: ${{ secrets.RELAY_REPO_TOKEN || github.token }}
    - name: Relais à côté du dépôt
      shell: bash
      run: mv .t2c-relay ../T2C-Phantom-relay
    
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        
    - name: Run Google OSV-Scanner Natively
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@v1
        osv-scanner --config osv-scanner.toml -r ./
