name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [ "main" ]

jobs:
  scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        
    - name: Run Google OSV-Scanner Natively
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@v1
        osv-scanner -r ./
