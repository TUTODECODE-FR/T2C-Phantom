name: DCO Check

on:
  pull_request:
    branches: [ "main" ]

# jeton en lecture seule par défaut (écriture seulement là où il le faut)
permissions:
  contents: read

jobs:
  check-dco:
    name: Verify Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          
      - name: Check DCO
        run: |
          echo "Checking commits for DCO (Signed-off-by) signature..."
          for commit in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git show -s --format=%B $commit | grep -q 'Signed-off-by:'; then
              echo "[erreur] Error: Commit $commit is missing the 'Signed-off-by:' line."
              echo "Please amend your commits with 'git commit --amend -s' and force push."
              exit 1
            fi
          done
